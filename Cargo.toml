[package]
name = "loldriver_scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_EventLog"] }
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
sha2 = "0.10"
csv = "1"
